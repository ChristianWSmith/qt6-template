name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  UPLOAD_DIR: upload

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Python version from Pipfile
        id: python_version
        shell: bash
        run: |
          PYTHON_VERSION=$(awk -F'"' '/python_version/ { print $2 }' Pipfile)
          echo "python-version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python_version.outputs.python-version }}

      - name: Install pipenv
        shell: bash
        run: pip install pipenv

      - name: Install Python dependencies
        shell: bash
        run: pipenv install --dev --deploy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0 \
            fuse libfuse2 imagemagick patchelf

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install deployment tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup 7zip -y

      - name: Build and test
        shell: bash
        run: |
          source scripts/env.sh
          export PATH="${QT_BIN}:${PATH}"
          pipenv run bash scripts/build.sh --test ON
        env:
          QT_QPA_PLATFORM: offscreen

      # TEMPORARY: bundle+upload on PRs too, to verify macOS fix before merge.
      # Restore main-push-only gating before merging.
      - name: Bundle Application Native (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.github/scripts/linux-bundle-native.sh

      - name: Bundle Application AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.github/scripts/linux-bundle-appimage.sh

      - name: Bundle Application (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./.github/scripts/mac-bundle-app.sh

      - name: Bundle Application Installer + Portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.github/scripts/windows-bundle.sh ${{ env.BUILD_TYPE }} true

      - name: Move Artifact to Uploads
        shell: bash
        run: |
          source scripts/env.sh
          mv "${PROJECT_ROOT}/dist" "${{ env.UPLOAD_DIR }}"

      - name: Upload Executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: ${{ env.UPLOAD_DIR }}
