name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      # Set from app.env so conan/cmake find Qt and use correct app name
      APP_NAME: MyApp
      APP_VERSION: "0.1.0"
      QT_VERSION: "6.11.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Python version from Pipfile
        id: python_version
        shell: bash
        run: |
          PYTHON_VERSION=$(awk -F'"' '/python_version/ { print $2 }' Pipfile)
          echo "python-version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python_version.outputs.python-version }}

      - name: Install pipenv
        shell: bash
        run: pip install pipenv

      - name: Install Python dependencies
        shell: bash
        run: pipenv install --dev --deploy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0

      - name: Determine platform vars
        id: platform
        shell: bash
        run: |
          PLATFORM=$(python -c 'import platform; print(platform.system().lower())')
          case "${PLATFORM}" in
            linux)
              echo "compiler_dir=gcc_64" >> "$GITHUB_OUTPUT"
              echo "conan_profile=conan/profiles/linux" >> "$GITHUB_OUTPUT"
              ;;
            windows)
              echo "compiler_dir=msvc2022_64" >> "$GITHUB_OUTPUT"
              echo "conan_profile=conan/profiles/windows" >> "$GITHUB_OUTPUT"
              ;;
            darwin)
              echo "compiler_dir=macos" >> "$GITHUB_OUTPUT"
              echo "conan_profile=conan/profiles/darwin" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install Qt
        shell: bash
        run: |
          QT_ROOT="Qt/${QT_VERSION}/${{ steps.platform.outputs.compiler_dir }}"
          if [ ! -e "${QT_ROOT}" ]; then
            ./scripts/install-qt.sh
          fi

      - name: Build and test
        shell: bash
        run: |
          touch CMakeLists.txt tests/CMakeLists.txt
          pipenv run conan build . \
            --output-folder build \
            --profile:build="${{ steps.platform.outputs.conan_profile }}" \
            --profile:host="${{ steps.platform.outputs.conan_profile }}" \
            -s build_type=Release \
            --build=missing
        env:
          QT_QPA_PLATFORM: offscreen
