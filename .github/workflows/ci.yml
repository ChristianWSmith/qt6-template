name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Python version from Pipfile
        id: python_version
        shell: bash
        run: |
          PYTHON_VERSION=$(awk -F'"' '/python_version/ { print $2 }' Pipfile)
          echo "python-version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python_version.outputs.python-version }}

      - name: Install pipenv
        shell: bash
        run: pip install pipenv

      - name: Install Python dependencies
        shell: bash
        run: pipenv install --dev --deploy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0

      - name: Set up build environment
        id: build_env
        shell: bash
        run: |
          # Source app.env for APP_NAME etc.
          source app.env

          # Detect platform
          PLATFORM=$(python -c 'import platform; print(platform.system().lower())')

          case "${PLATFORM}" in
            linux)
              COMPILER_DIR="gcc_64"
              CONAN_PROFILE="conan/profiles/linux"
              ;;
            windows)
              COMPILER_DIR="msvc2022_64"
              CONAN_PROFILE="conan/profiles/windows"
              ;;
            darwin)
              COMPILER_DIR="macos"
              CONAN_PROFILE="conan/profiles/darwin"
              ;;
          esac

          QT_ROOT="Qt/${QT_VERSION}/${COMPILER_DIR}"
          QT_CMAKE_DIR="${QT_ROOT}/lib/cmake/Qt6"

          echo "qt_root=${QT_ROOT}" >> "$GITHUB_OUTPUT"
          echo "qt_cmake_dir=${QT_CMAKE_DIR}" >> "$GITHUB_OUTPUT"
          echo "conan_profile=${CONAN_PROFILE}" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        shell: bash
        run: |
          if [ ! -e "${{ steps.build_env.outputs.qt_root }}" ]; then
            ./scripts/install-qt.sh
          fi

      - name: Build and test
        shell: bash
        run: |
          touch CMakeLists.txt tests/CMakeLists.txt
          pipenv run conan build . \
            --output-folder build \
            --profile:build="${{ steps.build_env.outputs.conan_profile }}" \
            --profile:host="${{ steps.build_env.outputs.conan_profile }}" \
            -s build_type=Release \
            --build=missing
        env:
          QT_QPA_PLATFORM: offscreen
