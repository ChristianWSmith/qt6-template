name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  UPLOAD_DIR: upload

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Architecture boundary checks
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/check-architecture-boundaries.sh

      - name: Extract Python version from Pipfile
        id: python_version
        shell: bash
        run: |
          PYTHON_VERSION=$(awk -F'"' '/python_version/ { print $2 }' Pipfile)
          echo "python-version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python_version.outputs.python-version }}

      - name: Install pipenv
        shell: bash
        run: pip install pipenv

      - name: Install Python dependencies
        shell: bash
        run: pipenv install --dev --deploy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0 \
            fuse libfuse2 imagemagick patchelf
          # AUD-108: runner compiler major must match conan/profiles/linux.
          PROFILE_MAJOR=$(awk -F= '/^compiler.version=/ { print $2 }' conan/profiles/linux)
          PROFILE_MAJOR="${PROFILE_MAJOR%%.*}"
          if ! command -v "g++-${PROFILE_MAJOR}" >/dev/null 2>&1; then
            sudo apt-get install -y "gcc-${PROFILE_MAJOR}" "g++-${PROFILE_MAJOR}" || {
              sudo apt-get install -y software-properties-common
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
              sudo apt-get install -y "gcc-${PROFILE_MAJOR}" "g++-${PROFILE_MAJOR}"
            }
          fi
          sudo update-alternatives --install /usr/bin/gcc gcc "/usr/bin/gcc-${PROFILE_MAJOR}" "${PROFILE_MAJOR}0" \
            --slave /usr/bin/g++ g++ "/usr/bin/g++-${PROFILE_MAJOR}" \
            --slave /usr/bin/gcov gcov "/usr/bin/gcov-${PROFILE_MAJOR}"
          gcc --version | head -1
          g++ --version | head -1

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install deployment tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup 7zip -y

      - name: Toolchain versions
        shell: bash
        run: |
          source scripts/env.sh
          echo "PLATFORM=${PLATFORM}"
          echo "QT_BIN=${QT_BIN}"
          echo "QT_ROOT=${QT_ROOT}"
          cmake --version | head -1
          "${CXX:-g++}" --version | head -1
          python --version

      # AUD-108: Linux runner compiler major must match conan/profiles/linux
      # compiler.version. Conan does not verify profile vs detected compiler —
      # drift here would silently build with the wrong toolchain. Profiles
      # differ per platform; the guard is Linux-only.
      - name: Compiler profile guard (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PROFILE_VERSION=$(awk -F= '/^compiler.version=/ { print $2 }' conan/profiles/linux)
          PROFILE_MAJOR="${PROFILE_VERSION%%.*}"
          ACTUAL_VERSION=$("${CXX:-g++}" -dumpfullversion)
          ACTUAL_MAJOR="${ACTUAL_VERSION%%.*}"
          echo "conan/profiles/linux compiler.version=${PROFILE_VERSION} (major ${PROFILE_MAJOR})"
          echo "runner ${CXX:-g++} -dumpfullversion=${ACTUAL_VERSION} (major ${ACTUAL_MAJOR})"
          if [ "${PROFILE_MAJOR}" != "${ACTUAL_MAJOR}" ]; then
            echo "ERROR: Linux runner compiler major ${ACTUAL_MAJOR} does not match conan/profiles/linux compiler.version=${PROFILE_VERSION}" >&2
            echo "Install gcc-${PROFILE_MAJOR}/g++-${PROFILE_MAJOR} on the runner (see Install system dependencies step) or update the profile deliberately." >&2
            exit 1
          fi

      # Production binary --smoke-test runs inside build.sh --test ON (after ctest).
      # No separate CI step: the script invokes the built app headless on the same
      # platform paths used by run.sh/packaging; a missing target hard-fails under
      # CI/BUILD_TESTING=ON via scripts/lib/resolve-app-path.sh.
      - name: Build and test
        shell: bash
        run: |
          source scripts/env.sh
          pipenv run bash scripts/build.sh --test ON
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Generator smoke test
        shell: bash
        run: |
          source scripts/env.sh
          bash scripts/test-generator.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Bundle Application Native (Linux)
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.github/scripts/linux-bundle-native.sh

      - name: Bundle Application AppImage (Linux)
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.github/scripts/linux-bundle-appimage.sh

      - name: Bundle Application (macOS)
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: ./.github/scripts/mac-bundle-app.sh

      - name: Bundle Application Installer + Portable (Windows)
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.github/scripts/windows-bundle.sh ${{ env.BUILD_TYPE }} true

      - name: Move Artifact to Uploads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          source scripts/env.sh
          mv "${PROJECT_ROOT}/dist" "${{ env.UPLOAD_DIR }}"

      - name: Upload Executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: ${{ env.UPLOAD_DIR }}
