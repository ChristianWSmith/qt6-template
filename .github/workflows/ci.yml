name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Python version from Pipfile
        id: python_version
        shell: bash
        run: |
          PYTHON_VERSION=$(awk -F'"' '/python_version/ { print $2 }' Pipfile)
          echo "python-version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python_version.outputs.python-version }}

      - name: Install pipenv
        run: pip install pipenv

      - name: Install Python dependencies
        run: pipenv install --dev --deploy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libfontenc-dev libice-dev libsm-dev \
            libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev \
            libxdmcp-dev libxtst-dev libxinerama-dev libxkbfile-dev \
            libxrandr-dev libxres-dev libxss-dev libxcb-util-dev \
            libxcb-util-wm-dev libxcb-util-image-dev libxcb-util-keysyms-dev \
            libxcb-util-renderutil-dev libxxf86vm-dev libxv-dev \
            libxcb-cursor-dev libx11-xcb-dev

      - name: Build and test
        run: pipenv run ./scripts/build.sh --test ON
